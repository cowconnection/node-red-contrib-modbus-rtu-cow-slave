<script type="text/javascript">
    RED.nodes.registerType('modbus-rtu-slave', {
        category: 'function',
        color: '#a6bbcf',
        defaults: {
            name: { value: "" },
            serialPort: { value: "/dev/ttyUSB0" },
            baudRate: { value: 9600 },
            dataBits: { value: 8 },
            stopBits: { value: 1 },
            parity: { value: "none" },
            slaveId: { value: 1 }
        },
        inputs: 1,
        outputs: 1,
        icon: "file.png",
        label: function() {
            return this.name || "Modbus RTU Slave";
        }
    });
</script>

<div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
</div>
<div class="form-row">
    <label for="node-input-serialPort"><i class="fa fa-plug"></i> Serial Port</label>
    <input type="text" id="node-input-serialPort" placeholder="/dev/ttyUSB0" />
</div>
<div class="form-row">
    <label for="node-input-baudRate"><i class="fa fa-clock"></i> Baudrate</label>
    <input type="number" id="node-input-baudRate" value="9600" />
</div>
<div class="form-row">
    <label for="node-input-dataBits"><i class="fa fa-cog"></i> Data Bits</label>
    <input type="number" id="node-input-dataBits" value="8" />
</div>
<div class="form-row">
    <label for="node-input-stopBits"><i class="fa fa-cog"></i> Stop Bits</label>
    <input type="number" id="node-input-stopBits" value="1" />
</div>
<div class="form-row">
    <label for="node-input-parity"><i class="fa fa-cog"></i> Parity</label>
    <select id="node-input-parity">
        <option value="none">None</option>
        <option value="even">Even</option>
        <option value="odd">Odd</option>
    </select>
</div>
<div class="form-row">
    <label for="node-input-slaveId"><i class="fa fa-id-badge"></i> Slave ID</label>
    <input type="number" id="node-input-slaveId" value="1" />
</div>
